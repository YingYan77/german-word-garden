const copy={en:{heading:'Let your German <em>grow.</em>',subtitle:'One word at a time. Your personal vocabulary notebook, in three languages.',wordcount:'words collected',search:'Search German, English or Chinese…',add:'+ Add a word',all:'All words',adj:'Adjectives',noun:'Nouns',verb:'Verbs',adv:'Adverbs',prep:'Prepositions',other:'Other',storage:'Saved in this browser · Export a backup to keep your words.',export:'Export backup',import:'Import backup',word:'German word (include article for nouns)',category:'Word category',pronunciation:'Pronunciation / grammar note (optional)',examplede:'German example',exampleen:'English translation',examplecn:'Chinese translation',cancel:'Cancel',save:'Save word',new:'Plant a new word',edit:'Edit word',editbtn:'Edit',remove:'Delete',listen:'Listen',empty:'No words here yet. Add a word or try another search.',saved:'Word saved',failed:'Could not save. Please export a backup.',bad:'Invalid backup file',imported:'Backup imported',confirm:'Delete this word?',speech:'Pronunciation is unavailable in this browser.'},de:{heading:'Lass dein Deutsch <em>wachsen.</em>',subtitle:'Ein Wort nach dem anderen. Dein persönliches Vokabelheft in drei Sprachen.',wordcount:'Wörter gesammelt',search:'Deutsch, Englisch oder Chinesisch suchen…',add:'+ Wort hinzufügen',all:'Alle Wörter',adj:'Adjektive',noun:'Nomen',verb:'Verben',adv:'Adverbien',prep:'Präpositionen',other:'Sonstige',storage:'In diesem Browser gespeichert · Sichere deine Wörter mit einem Export.',export:'Sicherung exportieren',import:'Sicherung importieren',word:'Deutsches Wort (Nomen mit Artikel)',category:'Wortart',pronunciation:'Aussprache / Grammatikhinweis (optional)',examplede:'Deutsches Beispiel',exampleen:'Englische Übersetzung',examplecn:'Chinesische Übersetzung',cancel:'Abbrechen',save:'Wort speichern',new:'Ein neues Wort pflanzen',edit:'Wort bearbeiten',editbtn:'Bearbeiten',remove:'Löschen',listen:'Anhören',empty:'Noch keine Wörter. Füge ein Wort hinzu oder ändere die Suche.',saved:'Wort gespeichert',failed:'Speichern fehlgeschlagen. Bitte exportiere eine Sicherung.',bad:'Ungültige Sicherungsdatei',imported:'Sicherung importiert',confirm:'Dieses Wort löschen?',speech:'Die Aussprache ist in diesem Browser nicht verfügbar.'},cn:{heading:'让你的德语<em>生根发芽。</em>',subtitle:'每天积累一个词。你的德英中三语词汇笔记本。',wordcount:'个已收藏单词',search:'搜索德语、英语或中文…',add:'+ 添加单词',all:'全部单词',adj:'形容词',noun:'名词',verb:'动词',adv:'副词',prep:'介词',other:'其他',storage:'保存在当前浏览器中 · 请导出备份以保存单词。',export:'导出备份',import:'导入备份',word:'德语单词（名词请包含冠词）',category:'词性',pronunciation:'发音 / 语法提示（选填）',examplede:'德语例句',exampleen:'英语翻译',examplecn:'中文翻译',cancel:'取消',save:'保存单词',new:'种下一个新单词',edit:'编辑单词',editbtn:'编辑',remove:'删除',listen:'听发音',empty:'暂无单词。添加单词或尝试其他搜索。',saved:'单词已保存',failed:'无法保存，请导出备份。',bad:'备份文件无效',imported:'备份已导入',confirm:'删除这个单词？',speech:'此浏览器暂不支持语音播放。'}};
Object.assign(copy.en,{source:'Where I learned this word',sourceDe:'Source sentence · German (optional)',sourceEn:'Source sentence · English (optional)',sourceCn:'Source sentence · Chinese (optional)',context:'Here, hat … bewegt is the perfect tense of bewegen: moved or deeply affected. Hauptstadt refers to Berlin.'});
Object.assign(copy.de,{source:'Hier habe ich das Wort gelernt',sourceDe:'Ursprungssatz · Deutsch (optional)',sourceEn:'Ursprungssatz · Englisch (optional)',sourceCn:'Ursprungssatz · Chinesisch (optional)',context:'Hier ist hat … bewegt das Perfekt von bewegen: emotional berührt oder stark beeinflusst. Mit Hauptstadt ist Berlin gemeint.'});
Object.assign(copy.cn,{source:'我在哪里学到这个词',sourceDe:'来源句子 · 德语（选填）',sourceEn:'来源句子 · 英语（选填）',sourceCn:'来源句子 · 中文（选填）',context:'这里 hat … bewegt 是 bewegen 的现在完成时，表示“感动了；深深影响了”。Hauptstadt 指柏林。'});
const learnedSource={sourceDe:'Die Geschichte der deutschen Hauptstadt hat die Welt bewegt.',sourceEn:'The history of the German capital has moved the world.',sourceCn:'德国首都的历史触动了全世界。'};
const seed=JSON.parse(document.getElementById('vocabulary-data').textContent);
let words=seed,lang='en',filter='all',editing=null;try{words=JSON.parse(localStorage.getItem('wortgarten-offline-words'))||seed;lang=localStorage.getItem('wortgarten-offline-lang')||'en'}catch{}if(!copy[lang])lang='en';
// User-selected starting date: apply once to current browser cards, including personal additions.
try{if(!localStorage.getItem('wortgarten-start-date-2026-10-17')){
for(const w of words)w.addedOn='2026-10-17';
localStorage.setItem('wortgarten-offline-words',JSON.stringify(words));
localStorage.setItem('wortgarten-start-date-2026-10-17','done');
}}catch{}
// Merge newly embedded cards once; keep user edits and remember deleted cards.
try{const known=new Set(JSON.parse(localStorage.getItem('wortgarten-offline-embedded-ids'))||words.map(w=>w.id));for(const item of seed){if(!known.has(item.id)&&!words.some(w=>w.id===item.id))words.push({...item});known.add(item.id);}localStorage.setItem('wortgarten-offline-words',JSON.stringify(words));localStorage.setItem('wortgarten-offline-embedded-ids',JSON.stringify([...known]));}catch{}











// Add this conversation's new vocabulary once, preserving saved cards and later deletions.

// Supply the newly shared source for existing browser-saved seed cards, preserving user edits.
for(const w of words){if(['bewegt-adj','bewegt-verb'].includes(w.id))for(const [k,v] of Object.entries(learnedSource))if(w[k]===undefined)w[k]=v;}
// Remove the retired spelling note from this card, including browser-saved copies.
let spellingNoteRemoved=false;
for(const w of words){if(w.id==='um-zu-infinitive-pattern'){
for(const [key,note] of [['en',' Source spelling corrected: Millionnen → Millionen.'],['cn','原句拼写已更正：Millionnen → Millionen。']]){
if(typeof w[key]==='string'&&w[key].includes(note)){w[key]=w[key].replace(note,'');spellingNoteRemoved=true;}
}}}
if(spellingNoteRemoved){try{localStorage.setItem('wortgarten-offline-words',JSON.stringify(words));}catch{}}
// Add learning-source labels to previously saved copies without replacing edits.
const embeddedLabels=new Map(seed.map(w=>[w.id,w.learningLabel]));
let learningLabelsAdded=false;
for(const w of words){if(w.learningLabel===undefined&&embeddedLabels.get(w.id)){
w.learningLabel=embeddedLabels.get(w.id);learningLabelsAdded=true;
}}
if(learningLabelsAdded){try{localStorage.setItem('wortgarten-offline-words',JSON.stringify(words));}catch{}}
Object.assign(copy.en,{learningLabel:'Learned from / label (optional)'});
Object.assign(copy.de,{learningLabel:'Lernquelle / Label (optional)'});
Object.assign(copy.cn,{learningLabel:'学习来源 / 标签（选填）'});
Object.assign(copy.en,{addedOn:'Added on',dateUnknown:'Unknown'});
Object.assign(copy.de,{addedOn:'Hinzugefügt am',dateUnknown:'Unbekannt'});
Object.assign(copy.cn,{addedOn:'添加日期',dateUnknown:'未知'});
Object.assign(copy.en,{filters:'Filters',dateFrom:'Added from',dateTo:'Added until',filterSource:'Learning source',allSources:'All sources',noSource:'No label',clearFilters:'Clear filters',activeFilters:'active',results:'Showing {n} of {total} words',dateRangeError:'The start date must be on or before the end date.'});
Object.assign(copy.de,{filters:'Filter',dateFrom:'Hinzugefügt ab',dateTo:'Hinzugefügt bis',filterSource:'Lernquelle',allSources:'Alle Quellen',noSource:'Ohne Label',clearFilters:'Filter zurücksetzen',activeFilters:'aktiv',results:'{n} von {total} Wörtern',dateRangeError:'Das Startdatum muss vor oder am Enddatum liegen.'});
Object.assign(copy.cn,{filters:'筛选',dateFrom:'添加起始日期',dateTo:'添加截止日期',filterSource:'学习来源',allSources:'全部来源',noSource:'无标签',clearFilters:'清除筛选',activeFilters:'项已启用',results:'显示 {n} / {total} 个单词',dateRangeError:'起始日期不能晚于截止日期。'});
let sourceFilter='';
function renderSearchFilters(){
const labels=[...new Set(words.map(w=>(w.learningLabel||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
if(sourceFilter.startsWith('label:')&&!labels.includes(sourceFilter.slice(6)))labels.push(sourceFilter.slice(6));
$('#filter-source').innerHTML=`<option value="">${t('allSources')}</option><option value="unlabelled">${t('noSource')}</option>`+labels.map(label=>`<option value="${esc('label:'+label)}">${esc(label)}</option>`).join('');
$('#filter-source').value=sourceFilter;
const from=$('#filter-from').value,to=$('#filter-to').value;
const active=Number(Boolean(from))+Number(Boolean(to))+Number(Boolean(sourceFilter));
$('#filter-status').textContent=active?` · ${active} ${t('activeFilters')}`:'';
$('#filter-error').hidden=!(from&&to&&from>to);
$('#filter-error').textContent=t('dateRangeError');
return {from,to};
}
function matchesSearchFilters(w,from,to){
if((from||to)&&!validAddedOn(w.addedOn))return false;
if(from&&w.addedOn<from||to&&w.addedOn>to)return false;
const label=(w.learningLabel||'').trim();
return !sourceFilter||(sourceFilter==='unlabelled'?!label:label===sourceFilter.slice(6));
}
// Store calendar dates rather than UTC timestamps so a word keeps its original day.
function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function validAddedOn(value){if(typeof value!=='string'||!/^\d{4}-\d{2}-\d{2}$/.test(value)||Number(value.slice(0,4))===0)return false;const date=new Date(value+'T12:00:00Z');return !isNaN(date)&&date.toISOString().slice(0,10)===value}
function addedOnText(value){return validAddedOn(value)?new Intl.DateTimeFormat(lang==='cn'?'zh-CN':lang,{dateStyle:'medium',timeZone:'UTC'}).format(new Date(value+'T12:00:00Z')):t('dateUnknown')}
const t=k=>copy[lang][k]||k,esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function notice(s){$('#notice').textContent=s;$('#notice').style.display='block';setTimeout(()=>$('#notice').style.display='none',3500)}
function persist(){try{localStorage.setItem('wortgarten-offline-words',JSON.stringify(words));return true}catch{notice(t('failed'));return false}}
function render(){document.documentElement.lang=lang==='cn'?'zh-CN':lang;$('#locale').value=lang;$('#heading').innerHTML=t('heading');for(const id of ['subtitle','wordcount','add','storage','export','import','cancel','save'])$('#'+id).textContent=t(id);$('#search').placeholder=t('search');document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));$('#count').textContent=words.length;$('#tabs').innerHTML=types.map(x=>`<button class="${x===filter?'active':''}" data-filter="${x}" aria-pressed="${x===filter}">${t(x)} <small>${x==='all'?words.length:words.filter(w=>w.type===x).length}</small></button>`).join('');const {from,to}=renderSearchFilters();const q=$('#search').value.toLocaleLowerCase();const selected=words.filter(w=>(filter==='all'||w.type===filter)&&matchesSearchFilters(w,from,to)&&Object.values(w).join(' ').toLocaleLowerCase().includes(q));$('#search-results').textContent=t('results').replace('{n}',selected.length).replace('{total}',words.length);$('#cards').innerHTML=selected.length?selected.map(w=>`<article class="card"><div class="cardtop"><div class="badges"><span class="badge">${t(w.type)}</span>${w.learningLabel?`<span class="badge learning-label" title="${esc(t('learningLabel'))}">${esc(w.learningLabel)}</span>`:''}</div><span class="eyebrow">DE / EN / CN</span></div><h2 lang="de">${esc(w.word)}</h2><div class="pron">${esc(w.pron)}</div><div class="card-date">${t('addedOn')}: ${validAddedOn(w.addedOn)?`<time datetime="${esc(w.addedOn)}">${esc(addedOnText(w.addedOn))}</time>`:esc(t('dateUnknown'))}</div><div class="meaning"><span class="lang">EN</span><span lang="en">${esc(w.en)}</span></div><div class="meaning"><span class="lang">CN</span><span lang="zh-CN">${esc(w.cn)}</span></div>${w.sourceDe?`<div class="source"><div class="eyebrow">${t('source')}</div><p class="de" lang="de">${esc(w.sourceDe)}</p><p lang="en">${esc(w.sourceEn)}</p><p lang="zh-CN">${esc(w.sourceCn)}</p>${w.sourceDe===learnedSource.sourceDe?`<p class="context">${t('context')}</p>`:''}</div>`:''}<div class="example"><p class="de" lang="de">${esc(w.de).replace(/\n/g,'<br>')}</p><p lang="en">${esc(w.exen).replace(/\n/g,'<br>')}</p><p lang="zh-CN">${esc(w.excn).replace(/\n/g,'<br>')}</p></div><div class="actions"><button data-action="listen" data-id="${esc(w.id)}">♫ ${t('listen')}</button><button data-action="edit" data-id="${esc(w.id)}">${t('editbtn')}</button><button data-action="remove" data-id="${esc(w.id)}">${t('remove')}</button></div></article>`).join(''):`<div class="empty">${t('empty')}</div>`}
function openEditor(w){editing=w?.id||null;$('#form').reset();$('#form').elements.addedOn.value=w?(validAddedOn(w.addedOn)?w.addedOn:''):today();$('#formtitle').textContent=t(w?'edit':'new');$('#form select').innerHTML=types.slice(1).map(x=>`<option value="${x}">${t(x)}</option>`).join('');if(w)Object.entries(w).forEach(([k,v])=>{if($('#form').elements[k])$('#form').elements[k].value=v});$('#editor').showModal()}
$('#filter-from').oninput=render;$('#filter-to').oninput=render;
$('#filter-source').onchange=e=>{sourceFilter=e.target.value;render()};
$('#clear-filters').onclick=()=>{$('#filter-from').value='';$('#filter-to').value='';sourceFilter='';render()};
$('#locale').onchange=e=>{lang=e.target.value;try{localStorage.setItem('wortgarten-offline-lang',lang)}catch{}render()};$('#search').oninput=render;$('#tabs').onclick=e=>{const b=e.target.closest('[data-filter]');if(b){filter=b.dataset.filter;render()}};$('#add').onclick=()=>openEditor();$('#cancel').onclick=()=>$('#editor').close();$('#form').onsubmit=e=>{e.preventDefault();const w=Object.fromEntries(new FormData(e.target));for(const k in w)w[k]=w[k].trim();if(!w.word||!w.en||!w.cn||!w.de)return;if(w.addedOn&&!validAddedOn(w.addedOn))return;if(!editing&&!w.addedOn)w.addedOn=today();w.id=editing||crypto.randomUUID();if(editing)words=words.map(x=>x.id===editing?w:x);else words.unshift(w);const ok=persist();$('#editor').close();render();if(ok)notice(t('saved'))};$('#cards').onclick=e=>{const b=e.target.closest('[data-action]');if(!b)return;const w=words.find(x=>x.id===b.dataset.id);if(b.dataset.action==='edit')openEditor(w);if(b.dataset.action==='remove'&&confirm(t('confirm'))){words=words.filter(x=>x.id!==w.id);persist();render()}if(b.dataset.action==='listen'){if(!window.speechSynthesis){notice(t('speech'));return}speechSynthesis.cancel();const utter=new SpeechSynthesisUtterance(w.word);utter.lang='de-DE';utter.rate=.85;speechSynthesis.speak(utter)}};
$('#export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,words},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='wortgarten-offline-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{try{const f=e.target.files[0];if(!f)return;if(f.size>5e6)throw Error();const data=JSON.parse(await f.text());if(!Array.isArray(data.words)||data.words.length>10000)throw Error();const incoming=data.words.map(w=>{if(!w||!types.slice(1).includes(w.type)||['word','en','cn','de'].some(k=>typeof w[k]!=='string'||!w[k].trim()))throw Error();if(w.addedOn!=null&&w.addedOn!==''&&!validAddedOn(w.addedOn))throw Error();const clean={id:crypto.randomUUID(),type:w.type,addedOn:w.addedOn||''};for(const k of ['word','en','cn','de','pron','exen','excn','sourceDe','sourceEn','sourceCn','learningLabel']){if(w[k]!=null&&typeof w[k]!=='string')throw Error();clean[k]=(w[k]||'').slice(0,3000)}return clean});const keys=new Set(words.map(w=>w.word+'|'+w.type));for(const w of incoming){const key=w.word+'|'+w.type;if(!keys.has(key)){words.push(w);keys.add(key)}}persist();render();notice(t('imported'))}catch{notice(t('bad'))}e.target.value=''};render();

</script></body></html>
