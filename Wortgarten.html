    "en": "To bottle up feelings; to swallow one’s anger or worries instead of expressing them. The idiom is etwas in sich hineinfressen, with the separable verb hineinfressen. In your sentence, Friss is the informal singular imperative of fressen, den Ärger is the accusative object, and in dich hinein means “inside yourself”. Nicht makes it a negative command: “Don’t bottle up your anger!” The pronoun changes with the subject: ich … in mich, du … in dich, er … in sich. Hinein goes at the end of a main clause; the participle is hineingefressen. This is figurative, not literally eating the anger.",

    "en": "Not even one percent. The key expression in the source is nicht einmal (“not even”), which emphasises how small a quantity is. Einmal does not mean “once” in this expression. Ein Prozent means one percent (1/100), and der Menschen is genitive plural: “of the people”. Thus nicht einmal ein Prozent der Menschen means “not even one percent of people”. Without nicht, einmal ein Prozent does not express the same idea. The pattern also works with other quantities or actions: nicht einmal zehn Minuten; nicht einmal eine Nachricht schreiben. In the source, lebte agrees with the singular quantity ein Prozent. Zur Zeit Christi means “at the time of Christ”; 1920 waren es schon 14 Prozent means “by 1920, it was already 14 percent”.",

const practiceKey='wortgarten-practice-v1',practiceKinds=['deToMeaning','meaningToDe','present','past','perfect'];
let practiceAttempts=[],practiceReadError=false,practiceRawBackup=null,quizSession=null,activePane='notebook';
function validatePractice(data){
 if(!data||data.version!==1||!Array.isArray(data.attempts)||data.attempts.length>50000)throw Error('Invalid practice history');
 const seen=new Set();
 return data.attempts.map(a=>{
  if(!a||typeof a.id!=='string'||!a.id||a.id.length>120||seen.has(a.id)||typeof a.wordKey!=='string'||a.wordKey.length>500||!practiceKinds.includes(a.kind)||typeof a.correct!=='boolean'||typeof a.at!=='string'||a.at.length>40||!Number.isFinite(Date.parse(a.at)))throw Error('Invalid practice attempt');
  const pair=JSON.parse(a.wordKey);if(!Array.isArray(pair)||pair.length!==2||pair.some(x=>typeof x!=='string'||!x.trim()))throw Error('Invalid word key');
  seen.add(a.id);return {id:a.id,wordKey:a.wordKey,kind:a.kind,correct:a.correct,at:a.at};
 });
}
function mergePractice(existing,incoming){
 const map=new Map(existing.map(a=>[a.id,a]));
 for(const a of incoming){const old=map.get(a.id);if(old&&JSON.stringify(old)!==JSON.stringify(a))throw Error('Conflicting practice attempt');map.set(a.id,a)}
 if(map.size>50000)throw Error('Practice history full');
 return [...map.values()].sort((a,b)=>Date.parse(a.at)-Date.parse(b.at)||a.id.localeCompare(b.id));
}
try{practiceRawBackup=localStorage.getItem(practiceKey);if(practiceRawBackup)practiceAttempts=validatePractice(JSON.parse(practiceRawBackup))}catch{practiceReadError=true}
function persistPractice(){if(practiceReadError){notice(t('practiceLoadFailed'));return false}try{localStorage.setItem(practiceKey,JSON.stringify({version:1,attempts:practiceAttempts}));return true}catch{notice(t('failed'));return false}}
function validPracticeWordKey(value){try{const pair=JSON.parse(value);return typeof value==='string'&&value.length<=500&&Array.isArray(pair)&&pair.length===2&&pair.every(x=>typeof x==='string'&&x.trim())}catch{return false}}
function wordKey(w){return validPracticeWordKey(w.practiceWordKey)?w.practiceWordKey:JSON.stringify([w.word.normalize('NFKC').trim().toLocaleLowerCase(),w.type])}
function wordAttempts(w){const key=wordKey(w);return practiceAttempts.filter(a=>a.wordKey===key)}
function summarizeAttempts(attempts){const correct=attempts.filter(a=>a.correct).length;return {total:attempts.length,correct,accuracy:attempts.length?Math.round(100*correct/attempts.length):null}}
function requiredSkills(w){return ['deToMeaning','meaningToDe',...(w.type==='verb'?['present','past','perfect']:[])]}
function wordStatus(w){
 const attempts=wordAttempts(w);if(!attempts.length)return 'newWord';
 const mastered=requiredSkills(w).every(kind=>{const a=attempts.filter(x=>x.kind===kind),min=kind==='deToMeaning'||kind==='meaningToDe'?3:2;return a.length>=min&&a.filter(x=>x.correct).length/a.length>=.8&&a.slice(-2).every(x=>x.correct)});
 if(mastered)return 'mastered';
 return requiredSkills(w).some(kind=>{const a=attempts.filter(x=>x.kind===kind);return a.length>=2&&(a.filter(x=>x.correct).length/a.length<.6||a.slice(-2).every(x=>!x.correct))})?'difficult':'learning';
}
function accuracyText(attempts){const s=summarizeAttempts(attempts);return s.total?`${s.accuracy}% · ${s.correct}/${s.total}`:t('noAttempts')}
function wordProgressHtml(w){return `<div class="word-progress"><span class="status-badge status-${wordStatus(w)}">${t(wordStatus(w))}</span> <span>${t('accuracy')}: ${accuracyText(wordAttempts(w))}</span></div>`}
function filteredWords(){const from=$('#filter-from').value,to=$('#filter-to').value,q=$('#search').value.toLocaleLowerCase();return words.filter(w=>(filter==='all'||w.type===filter)&&matchesSearchFilters(w,from,to)&&Object.values(w).join(' ').toLocaleLowerCase().includes(q))}
function normalizeAnswer(value){return String(value).normalize('NFKC').toLocaleLowerCase().replace(/ß/g,'ss').replace(/[.,!?。！？，、；;:：]+$/u,'').trim().replace(/\s+/g,' ')}
function alternatives(value){return String(value||'').split('|').map(x=>x.trim()).filter(Boolean)}
function germanAnswers(w){return alternatives(w.quizDe||w.word)}
function meaningAnswers(w,language){const short=w[language==='en'?'quizEn':'quizCn'];return alternatives(short||String(w[language]||'').split(/[。.;；\n]/u)[0]).map(x=>x.trim()).filter(Boolean)}
function answerMatches(answer,q){const actual=normalizeAnswer(answer),normal=x=>{const s=normalizeAnswer(x);return q.kind==='deToMeaning'?s.replace(/^to\s+/,''):s};return Boolean(actual)&&q.answers.some(a=>normal(a)===normal(actual))}
function makeQuestions(pool,mode,language){
 const questions=[];
 for(const w of pool){
  if(['mixed','deToMeaning','meaningToDe'].includes(mode)){
   if(mode!=='meaningToDe')questions.push({word:w,kind:'deToMeaning',prompt:germanAnswers(w)[0],promptLang:'de',answers:[...meaningAnswers(w,'en'),...meaningAnswers(w,'cn')],reference:`EN: ${meaningAnswers(w,'en').join(' / ')}\n中文: ${meaningAnswers(w,'cn').join(' / ')}`});
   if(mode!=='deToMeaning'){const l=language==='either'?(Math.random()<.5?'en':'cn'):language;questions.push({word:w,kind:'meaningToDe',prompt:meaningAnswers(w,l).join(' / '),promptLang:l==='cn'?'zh-CN':'en',answers:germanAnswers(w),reference:germanAnswers(w).join(' / ')})}
  }
  if(w.type==='verb'&&['mixed','verbs'].includes(mode))for(const [kind,field] of [['present','verbPresent'],['past','verbPast'],['perfect','verbPerfect']])if(alternatives(w[field]).length)questions.push({word:w,kind,prompt:germanAnswers(w)[0],promptLang:'de',answers:alternatives(w[field]),reference:alternatives(w[field]).join(' / ')});
 }
 return questions;
}
function shuffle(items){for(let i=items.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
function sessionText(){return t('sessionScore').replace('{correct}',quizSession?.correct||0).replace('{total}',quizSession?.total||0)}
function startQuiz(weakOnly=false){
 if(practiceReadError){notice(t('practiceLoadFailed'));return}
 const pool=filteredWords().filter(w=>!weakOnly||wordStatus(w)==='difficult');
 let questions=shuffle(makeQuestions(pool,$('#quiz-mode').value,$('#quiz-language').value));
 if(!questions.length){notice(t('noQuestions'));return}
 // Give difficult words priority without duplicating a question inside a session.
 const priority={difficult:0,newWord:1,learning:2,mastered:3};questions.sort((a,b)=>priority[wordStatus(a.word)]-priority[wordStatus(b.word)]);
 const limit=$('#quiz-length').value;questions=questions.slice(0,limit==='all'?questions.length:Number(limit)||10);
 quizSession={questions,index:0,total:0,correct:0,revealed:false,graded:false,answer:'',ended:false};setPane('practice');renderQuiz();
}
function currentQuestion(){return quizSession?.questions[quizSession.index]}
function revealAnswer(unknown=false){
 const s=quizSession;if(!s||s.revealed||s.ended)return;
 const answer=unknown?'':$('#quiz-answer').value.trim();if(!answer&&!unknown){notice(t('typeFirst'));return}
 s.answer=answer;s.revealed=true;s.unknown=unknown;renderQuiz();
}
function gradeAnswer(correct){
 const s=quizSession;if(!s||!s.revealed||s.graded||s.ended||practiceReadError)return;
 if(practiceAttempts.length>=50000){notice(t('historyFull'));return}
 // Revealing an unknown answer always counts as a miss.
 correct=Boolean(correct)&&!s.unknown;const q=currentQuestion();const at=new Date(Math.max(Date.now(),practiceAttempts.reduce((max,a)=>Math.max(max,Date.parse(a.at)),0)+1)).toISOString();
 practiceAttempts.push({id:crypto.randomUUID(),wordKey:wordKey(q.word),kind:q.kind,correct,at});
 s.graded=true;s.lastCorrect=correct;s.total++;if(correct)s.correct++;
 const saved=persistPractice();render();renderQuiz();if(!saved)notice(t('failed'));
}
function nextQuestion(){const s=quizSession;if(!s?.graded||s.ended)return;s.index++;s.revealed=false;s.graded=false;s.answer='';s.unknown=false;if(s.index>=s.questions.length)s.ended=true;renderQuiz()}
function endQuiz(){if(quizSession){quizSession.ended=true;renderQuiz()}}
function reviewWordCardHtml(w){
 const text=(value,language)=>value?`<p lang="${language}">${esc(value).replace(/\n/g,'<br>')}</p>`:'';
 const forms=[['present','verbPresent'],['past','verbPast'],['perfect','verbPerfect']].filter(([,field])=>w[field]);
 return `<article class="review-word"><div class="badges"><span class="badge">${t(w.type)}</span>${w.learningLabel?`<span class="badge learning-label">${esc(w.learningLabel)}</span>`:''}</div><h3 lang="de">${esc(w.word)}</h3><p class="small">${t('addedOn')}: ${esc(addedOnText(w.addedOn))}</p>${w.pron?`<section><h4>${t('reviewGrammar')}</h4>${text(w.pron,'de')}</section>`:''}<div class="meaning"><span class="lang">EN</span><span lang="en">${esc(w.en)}</span></div><div class="meaning"><span class="lang">CN</span><span lang="zh-CN">${esc(w.cn)}</span></div>${w.type==='verb'&&forms.length?`<section><h4>${t('reviewForms')}</h4><dl>${forms.map(([kind,field])=>`<dt>${t(kind)}</dt><dd lang="de">${esc(w[field])}</dd>`).join('')}</dl></section>`:''}${w.sourceDe||w.sourceEn||w.sourceCn?`<section class="source"><h4>${t('source')}</h4>${text(w.sourceDe,'de')}${text(w.sourceEn,'en')}${text(w.sourceCn,'zh-CN')}${w.sourceDe===learnedSource.sourceDe?`<p class="context">${t('context')}</p>`:''}</section>`:''}<section class="example"><h4>${t('reviewExamples')}</h4>${text(w.de,'de')}${text(w.exen,'en')}${text(w.excn,'zh-CN')}</section><section><h4>${t('reviewProgress')}</h4>${wordProgressHtml(w)}<div class="skill-breakdown">${requiredSkills(w).map(kind=>`<div><span>${t(kind)}</span><strong>${accuracyText(wordAttempts(w).filter(a=>a.kind===kind))}</strong></div>`).join('')}</div></section></article>`;
}
function openReviewCard(){

 body.innerHTML=`<div class="quiz-card"><div class="quiz-meta"><span>${t('questionNumber').replace('{n}',s.index+1).replace('{total}',s.questions.length)}</span><span>${sessionText()}</span></div><p class="eyebrow">${isVerb?`${t(q.kind)} · er`:t(q.kind)}</p><h2 class="quiz-prompt" lang="${q.promptLang}">${esc(q.prompt)}</h2><p>${instruction}</p><form id="practice-answer-form"><label>${t('yourAnswer')}<input id="quiz-answer" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="2000" ${s.revealed?'disabled':''} value="${esc(s.answer)}"></label>${!s.revealed?`<div class="quiz-buttons"><button class="primary" type="submit">${t('checkAnswer')}</button><button class="secondary" type="button" data-quiz-action="unknown">${t('dontKnow')}</button></div>`:''}</form>${s.revealed?`<div class="quiz-feedback" role="status"><strong>${t('reference')}</strong><p class="reference-text">${esc(q.reference)}</p><button id="quiz-view-card" class="secondary" type="button" data-quiz-action="view-card" aria-haspopup="dialog" aria-controls="review-card-dialog">${t('viewWordCard')}</button><p>${!s.unknown&&answerMatches(s.answer,q)?t('matched'):t('compare')}</p>${!s.graded?`<p class="small">${t('confirmGrade')}</p><div class="quiz-buttons">${!s.unknown?`<button class="primary" data-quiz-action="correct">${t('markCorrect')}</button>`:''}<button class="secondary" data-quiz-action="wrong">${t('markWrong')}</button></div>`:`<p>${t(s.lastCorrect?'recordedCorrect':'recordedWrong')}</p><button class="primary" data-quiz-action="next">${t(s.index===s.questions.length-1?'finishPractice':'nextQuestion')}</button>`}</div>`:''}<button class="text-button" data-quiz-action="end">${t('endSession')}</button></div>`;

}
function renderProgress(){
 const keys=new Set(words.map(wordKey)),all=practiceAttempts.filter(a=>keys.has(a.wordKey)),totals=summarizeAttempts(all),status=$('#progress-filter').value;
 $('#progress-summary').innerHTML=`<div><strong>${totals.total?totals.accuracy+'%':'—'}</strong><span>${t('accuracy')} · ${totals.correct}/${totals.total}</span></div>`+['mastered','difficult','learning','newWord'].map(s=>`<div><strong>${words.filter(w=>wordStatus(w)===s).length}</strong><span>${t(s)}</span></div>`).join('');
 const selected=words.filter(w=>!status||wordStatus(w)===status).sort((a,b)=>{const rank={difficult:0,learning:1,newWord:2,mastered:3};return rank[wordStatus(a)]-rank[wordStatus(b)]||a.word.localeCompare(b.word)});
 $('#progress-words').innerHTML=selected.length?selected.map(w=>`<details class="progress-word"><summary><span lang="de">${esc(w.word)}</span><span class="status-badge status-${wordStatus(w)}">${t(wordStatus(w))}</span><span>${accuracyText(wordAttempts(w))}</span></summary><div class="skill-breakdown">${requiredSkills(w).map(kind=>`<div><span>${t(kind)}</span><strong>${accuracyText(wordAttempts(w).filter(a=>a.kind===kind))}</strong></div>`).join('')}${w.type==='verb'&&['verbPresent','verbPast','verbPerfect'].some(k=>!w[k])?`<p>${t('formsMissing')}</p>`:''}</div></details>`).join(''):`<p>${t('noProgressWords')}</p>`;
}

for(const pane of ['notebook','practice','progress'])$('#mode-'+pane).onclick=()=>setPane(pane);
$('#start-practice').onclick=()=>startQuiz();$('#review-weak').onclick=()=>startQuiz(true);
$('#progress-filter').onchange=renderProgress;
$('#practice-body').onsubmit=e=>{e.preventDefault();revealAnswer()};
$('#practice-body').onclick=e=>{const b=e.target.closest('[data-quiz-action]');if(!b)return;const actions={'view-card':openReviewCard,unknown:()=>revealAnswer(true),correct:()=>gradeAnswer(true),wrong:()=>gradeAnswer(false),next:nextQuestion,end:endQuiz,restart:()=>startQuiz(),progress:()=>setPane('progress')};actions[b.dataset.quizAction]?.()};
// Keep the visible quiz translated when changing the interface language.
const originalLocaleChange=$('#locale').onchange;
$('#locale').onchange=e=>{if(quizSession&&!quizSession.revealed&&!quizSession.ended)quizSession.answer=$('#quiz-answer').value;originalLocaleChange(e);if(activePane==='practice')renderQuiz()};
render();setPane('notebook');

</script></body></html>
